[project]
name = "docker-cleanup"
version = "0.1.0"
description = "CLI tool to clean up Docker resources (dangling images, stopped containers, unused volumes)"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
]

[project.scripts]
docker-cleanup = "docker_cleanup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_cleanup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=docker_cleanup",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["docker_cleanup"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
